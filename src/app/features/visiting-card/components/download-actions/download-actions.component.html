<div class="download-actions" aria-label="Download your visiting card">
  <button
    class="btn btn-outline-light download-button"
    type="button"
    [disabled]="!enabled() || busy()"
    (click)="downloadPdf.emit()"
  >
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 2.5h7l3 3V17a.5.5 0 0 1-.5.5h-9A.5.5 0 0 1 5 17V3a.5.5 0 0 1 .5-.5ZM12 3.6V6h2.4L12 3.6ZM7 10h6m-6 2.5h6M7 15h3" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.35" /></svg>
    <span>{{ busy() ? 'Preparing your card…' : 'Download PDF' }}</span>
  </button>
  <button
    class="btn btn-outline-light download-button secondary-download"
    type="button"
    [disabled]="!enabled() || busy()"
    (click)="downloadPng.emit()"
  >
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5.5A1.5 1.5 0 0 1 4.5 4h11A1.5 1.5 0 0 1 17 5.5v9a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 14.5v-9Zm2.2 7.9 2.9-3.1 1.8 1.8 2.5-3 2.6 4.3H5.2Z" fill="currentColor" /><circle cx="7" cy="7.3" r="1" fill="#101e32" /></svg>
    <span>Download PNG <small>(front)</small></span>
  </button>
</div>
